# ForceKitBuilder — shadow-GUI page (v1: core loop only — generate,
# preview/lock, export). See DESIGN.md's "v2 scoping" section for the
# control-key table and rationale. No engine_* block: Kit Builder is
# request/response, not a continuous DSP engine, so there's no on/off
# button to draw.
#
# page=8, not 1-7: only seven SHIFT+SCENE-N combos physically exist, and
# on the real device all seven were already taken (DX7, JV-880, Maze
# Voice, Maze Seq, Acid, Euclidier, plus force-shadow's own launcher at
# slot 7). Kit Builder is exactly the "low-frequency tool" case
# docs/adding-a-page.md's "Add-on launcher (tool add-ons)" section
# describes - page 8+ isn't combo-bound, it's reached via the launcher
# page (SHIFT+SCENE-7) instead. Confirmed live 2026-09-21: page=1
# silently lost the slot to ForceDX7 (already there first), a real
# assumption this scoping got wrong before checking the actual device.
#
# style=td3: mockbamod-module-creator skill's shadow-gui.md now names
# this as the recommended default for new addons (force-acid's own
# theme, copied verbatim so this stays in visual sync with that one real
# source rather than a drifting hand-copy).
#
# Coordinates hand-checked against the real 1280x800 landscape canvas
# (force-shadow/tools/render_preview.c's LAND_W/LAND_H). Rendered with
# force-shadow/tools/render_conf_preview (the generic .conf preview tool,
# not the Maze-Voice-only one referenced in an earlier draft of this
# comment) before deploying - see DESIGN.md's v2 section for what that
# render caught (the font-safety issue below).
#
# Font-safety: force-shadow's baked glyph set is space, A-Z (uppercase
# only), 0-9, and ". - / > % + :" - nothing else renders (silently
# becomes blank, not an error). Every static label below is upper-case
# for this reason. Dynamic text from the daemon (pad_info, pads list
# labels, status) is sanitized the same way in addon/host/daemon.mjs's
# shadowFontSafe() before being sent over the control socket - a real
# sample filename like "Moombahton-Kick-MB Kick 14.WAV" has lowercase
# letters that would otherwise render as gaps.
page=8
ctrl_sock=/tmp/kitbuilder_ctrl.sock
display_name="KIT BUILDER"

style=td3
theme_bg=f5c400
theme_panel=f5c400
theme_line=0a0a0a
theme_ink=f0ede4
theme_ink_dim=9a9689
theme_ink_faint=5a5648
theme_accent=f5c400
theme_accent_hi=ffe066
theme_knob_face=2a2a2a
theme_knob_ring=050505
theme_bar=d9ac00
theme_seg_active=f5c400
theme_seg_inactive=2a2a2a
theme_seg_active_tx=0a0a0a
theme_btn_text=ffffff
theme_well=0a0a0a
theme_knob_off=4a4a4a
theme_tab_on=1f1f1f
theme_lcd=0a0a0a
theme_box=1f1f1f
theme_btn_bg=e8341c
theme_chrome_ink=0a0a0a
theme_go_on=35d07f
theme_go_off=e8341c
theme_tabs=d9ac00

[tab Kit]
frame   x=36 y=36 w=724 h=728 title="PADS"
list    x=52 y=76 w=672 h=650 key=pad_sel items=pads sel=pad_sel cols=4 rows=4 th=140 gap=16 jump=0 colmajor=0 numbered=1 scale=2
frame   x=776 y=36 w=468 h=728 title="SELECTED PAD"
readout x=792 y=76 w=436 h=100 label="" get=pad_info
toggle  cx=1010 cy=220 label="LOCK" key=pad_lock
button  cx=1010 cy=290 label="REASSIGN" key=reassign_pad
button  cx=1010 cy=390 label="GENERATE ALL" key=generate
button  cx=1010 cy=490 label="EXPORT KIT" key=export
readout x=792 y=540 w=436 h=190 label="" get=status
